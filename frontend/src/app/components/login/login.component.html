<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">🌿</div>
      <h2>Cultivo & Botânica</h2>
      <p>Acesse seu monitor de cultivo doméstico</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div *ngIf="errorMessage" class="error-banner">
        <span>⚠️</span> {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Digite seu e-mail" 
            required>
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="field-error" style="color: #ff858d; font-size: 0.8rem; margin-top: 0.2rem;">
          Digite um e-mail válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Digite sua senha" 
            required>
        </div>
      </div>

      <button type="submit" [disabled]="loginForm.invalid || loading" class="btn-submit">
        <span *ngIf="!loading">Entrar</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
    </div>
  </div>
</div>
