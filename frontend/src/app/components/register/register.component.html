<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">🌱</div>
      <h2>Nova Conta</h2>
      <p>Crie seu perfil no monitor de cultivo</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div *ngIf="errorMessage" class="error-banner">
        <span>⚠️</span> {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-banner">
        <span>✅</span> {{ successMessage }}
      </div>

      <div class="form-group">
        <label for="username">Usuário</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input 
            type="text" 
            id="username" 
            formControlName="username" 
            placeholder="Escolha seu usuário" 
            required>
        </div>
        <div *ngIf="registerForm.get('username')?.touched && registerForm.get('username')?.invalid" class="field-error">
          O usuário deve ter pelo menos 3 caracteres.
        </div>
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Digite seu melhor e-mail" 
            required>
        </div>
        <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="field-error">
          Digite um e-mail válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Crie uma senha forte" 
            required>
        </div>
        <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="field-error">
          A senha deve ter pelo menos 4 caracteres.
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid || loading" class="btn-submit">
        <span *ngIf="!loading">Cadastrar</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Já tem uma conta? <a routerLink="/login">Faça Login</a></p>
    </div>
  </div>
</div>
